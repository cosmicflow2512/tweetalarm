name: Build and push image

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # woechentlich neu bauen, zieht aktuelles RSSHub-Image
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/tweetalarm:latest
